services:
  - type: web
    name: classificacaoslotcar
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.5
      - key: APP_SECRET_KEY
        generateValue: true
